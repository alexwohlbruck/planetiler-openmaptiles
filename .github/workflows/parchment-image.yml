# Publish the fork's image for Parchment's basemap renders. See FORK.md.
name: Parchment image

on:
  push:
    tags: ['v*-importance.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build and push to ghcr
        run: >-
          ./mvnw -B -ntp -DskipTests package jib:build
          -Dimage=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          -Djib.to.tags=latest
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          -Djib.container.labels=org.opencontainers.image.source=https://github.com/${{ github.repository }}
